version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sevenmarket
      POSTGRES_PASSWORD: sevenmarket
      POSTGRES_DB: sevenmarket
    ports:
      - "5432:5432"
    volumes:
      - sevenmarket_pgdata:/var/lib/postgresql/data

volumes:
  sevenmarket_pgdata:
