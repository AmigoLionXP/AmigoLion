.shimmer{animation:shimmer 2.5s ease infinite}

.float-anim{animation:float 4s ease-in-out infinite}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:flex-end;justify-content:center;z-index:500;animation:overlayIn .2s ease;backdrop-filter:blur(4px)}
.sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:430px;padding:0;animation:slideUp .3s cubic-bezier(.34,1.15,.64,1);max-height:94vh;overflow-y:auto;display:flex;flex-direction:column}

/* ── PIN ── */
.pin-dot{width:15px;height:15px;border-radius:50%;border:2.5px solid #002366;transition:all .15s;flex-shrink:0}
.pin-dot.on{background:#002366;transform:scale(1.18)}
.pin-dot.err{border-color:#F43F5E;background:#F43F5E}

.step-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #F1F5F9}
.step-item:last-child{border-bottom:none}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;margin-top:1px}

.land-root{width:100%;max-width:430px;min-height:100vh;background:#000;overflow-x:hidden;overflow-y:auto;position:relative}
.land-exit{animation:landExit .55s cubic-bezier(.4,0,.2,1) forwards}
.app-enter{animation:appEnter .5s cubic-bezier(.4,0,.2,1) forwards}

.glitch-text{position:relative;display:inline-block}
.glitch-text::before,.glitch-text::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch-text::before{color:#9333EA;animation:glitch1 4s infinite;left:2px}
.glitch-text::after{color:#F59E0B;animation:glitch2 4s infinite 1.5s;left:-2px}
.pulse-ring{position:absolute;inset:-8px;border-radius:50%;border:1.5px solid rgba(147,51,234,.4);animation:pulseRing 2.2s ease-out infinite}
.pulse-ring-2{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(245,158,11,.25);animation:pulseRing 2.2s ease-out infinite .7s}

const TRIAL_DAYS = 7;
function getTrialStart() {
  const raw = localStorage.getItem("lionxp_trial_start");
  if (!raw) return null;
  return new Date(raw);
}
function initTrialStart() {
  if (!localStorage.getItem("lionxp_trial_start")) {
    localStorage.setItem("lionxp_trial_start", new Date().toISOString());
  }
}
function trialDaysLeft() {
  const start = getTrialStart();
  if (!start) return TRIAL_DAYS;
  const diff = Math.floor((Date.now() - start.getTime()) / (1000 * 60 * 60 * 24));
  return Math.max(0, TRIAL_DAYS - diff);
}
function trialActive() {
  const start = getTrialStart();
  if (!start) return false;
  return trialDaysLeft() > 0;
}
function trialExpired() {
  const start = getTrialStart();
  if (!start) return false;
  return trialDaysLeft() === 0;
}
function isPremiumActive(st) {
  return st.premium === true || trialActive();
}
