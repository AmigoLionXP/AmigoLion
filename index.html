// Auth helpers
const authStore = {
  getToken: () => localStorage.getItem(AUTH_KEY),
  setToken: t => localStorage.setItem(AUTH_KEY, t),
  removeToken: () => localStorage.removeItem(AUTH_KEY),
  getUser: () => { try { return JSON.parse(localStorage.getItem(AUTH_USER) || 'null'); } catch { return null; }},
  setUser: u => localStorage.setItem(AUTH_USER, JSON.stringify(u)),
  removeUser: () => localStorage.removeItem(AUTH_USER),
  clear: () => { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(AUTH_USER); }
};

async function authFetch(path, method = "GET", body = null) {
  const token = authStore.getToken();
  const opts = {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    },
    ...(body ? { body: JSON.stringify(body) } : {})
  };
  const res = await fetch(AUTH_WORKER + path, opts);
  return res.json();
}

async function authRegister(email, password, name) {
  const data = await authFetch("/auth/register", "POST", { email, password, name, lang: appLang });
  if (data.success) {
    authStore.setToken(data.token);
    authStore.setUser(data.user);
  }
  return data;
}

async function authLogin(email, password) {
  const data = await authFetch("/auth/login", "POST", { email, password });
  if (data.success) {
    authStore.setToken(data.token);
    authStore.setUser(data.user);
  }
  return data;
}

async function authMe() {
  if (!authStore.getToken()) return null;
  const data = await authFetch("/auth/me");
  if (data.success) return data;
  authStore.clear();
  return null;
}

async function authLogout() {
  await authFetch("/auth/logout", "POST");
  authStore.clear();
}

async function authSyncLocalState(state) {
  return authFetch("/auth/sync", "POST", { state });
}

async function authSaveProfile(profileId, profileData) {
  return authFetch("/auth/profile", "POST", { profileId, ...profileData });
}

function getTrialStart() {
  const raw = localStorage.getItem("lionxp_trial_start");
  if (!raw) return null;
  return new Date(raw);
}
function initTrialStart() {
  if (!localStorage.getItem("lionxp_trial_start")) {
    localStorage.setItem("lionxp_trial_start", new Date().toISOString());
  }

function trialDaysLeft() {
  const start = getTrialStart();
  if (!start) return TRIAL_DAYS;
  const diff = Math.floor((Date.now() - start.getTime()) / (1000 * 60 * 60 * 24));
  return Math.max(0, TRIAL_DAYS - diff);
}
function trialActive() {
  const start = getTrialStart();
  if (!start) return false;
  return trialDaysLeft() > 0;
}
function trialExpired() {
  const start = getTrialStart();
  if (!start) return false;
  return trialDaysLeft() === 0;
}
function isPremiumActive(st) {
  return st.premium === true || trialActive();
